<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estadísticas de Adopción</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../CSS/estadisticas.css">
</head>
<body>
  <header class="site-header">
    <h1>Estadísticas de Avisos de Adopción</h1>
    <p class="subtitle">Visualización de la información mediante gráficos</p>
  </header>

  <main class="estadisticas-container">
    <!-- Gráfico de líneas -->
    <section class="grafico">
      <h2>Cantidad de avisos por día</h2>
      <div class="grafico-imagen">
        <img src="../images/Graf.lineas.png" alt="Gráfico de líneas cantidad de avisos por día">
      </div>
    </section>

    <!-- Gráfico de torta -->
    <section class="grafico">
      <h2>Total de avisos por tipo de mascota</h2>
      <div class="grafico-imagen">
        <img src="../images/Graf.torta.png" alt="Gráfico de torta avisos por tipo">
      </div>
    </section>

    <!-- Gráfico de barras -->
    <section class="grafico">
      <h2>Cantidad de avisos por mes (gatos vs perros)</h2>
      <div class="grafico-imagen">
        <img src="../images/Graf.barras.png" alt="Gráfico de barras adopciones por mes">
      </div>
    </section>

    <!-- Enlace de regreso -->
    <div class="acciones">
      <a href="../html/Portada.html" class="btn">Volver a la portada</a>
    </div>
  </main>
</body>
</html>
